name: CI

on:
  push:
  pull_request:

jobs:
  ellenorzes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v7

      - name: Python telepítése
        uses: actions/setup-python@v7
        with: 
          python-version: "3.13"

      - name: Függőségek
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formázás
        run: ruff format --check .

      - name: Tesztek
        run: pytest -vv
